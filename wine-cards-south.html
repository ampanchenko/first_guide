<!--
========================================================================
  ЛУЧШИЕ РОССИЙСКИЕ ВИННЫЕ КАРТЫ · ПЕРВЫЙ ГИД
  Self-contained HTML block. Paste into Tilda T123 (HTML) container.

  Чтобы обновить данные:
    Замените содержимое <script id="fg-cards-data"> на свежий JSON.
    Формат: {"rating_title": "...", "rating_subtitle": "...", "restaurants": [...]}

  Поля ресторана:
    rank          — место (1..50)
    name          — название
    segment       — "🏆 Лидер" или "🥇 Топ-50" (на странице сейчас НЕ показывается)
    nomination    — текст спец-шильдика; если пусто — плашка не рисуется
    closed        — true, если ресторан закрыт: серая плашка «Закрыт»,
                    карточка приглушена, название зачёркнуто
    description   — литературное описание карты
    sommelier     — имя шеф-сомелье (string; если пусто — строка не показывается)
    depth         — бутылок в карте (Глубина)
    mono_grapes   — моно-сортовых вин
    blends        — бленды
    producers     — хозяйств
    regions       — регионов ЗГУ
    types_in_card — "n/6" типов вин в карте
    autochthons   — "сорта : бутылки" автохтонов
    card_breakdown — {red, white, rose, sparkling, orange, sweet} — состав карты по цветам
    btg           — {red, white, rose, sparkling, orange, sweet} — БТГ по цветам
    btg_types_count — "n/6" типов в БТГ
    median_glass_rub  — медиана бокала, ₽
    median_bottle_rub — медиана бутылки, ₽
    address        — почтовый адрес (string; если пусто — строка скрыта)
    website        — URL сайта (string; если пусто — ссылка скрыта)
========================================================================
-->

<style>
  /* ============ NAMESPACED RESET ============ */
  /* Match the host page background to .fg-cards so the iframe/Tilda wrapper
     doesn't show its default white frame around or below the block. */
  html, body { margin: 0; background: #cac4b0; }
  .fg-cards *,
  .fg-cards *::before,
  .fg-cards *::after {
    box-sizing: border-box;
  }
  .fg-cards {
    --ink: #1a1614;
    --ink-soft: #4a4035;
    --ink-faint: #7a6f60;
    --paper: #cac4b0;
    --paper-warm: #ede7d3;
    --paper-deep: #ffffff;
    --rule: #a8a08a;
    --rule-soft: #cfc6ad;
    --wine: #b72424;
    --wine-soft: #cf3a3a;
    --brand-red: #b72424;
    --gold: #a57430;
    --green: #4a7847;
    --rose: #d97a8f;
    --orange-tint: #d68a3a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .10);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .07);

    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.55;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "kern", "liga", "calt";
  }
  .fg-cards a { color: inherit; text-decoration: none; }
  .fg-cards button {
    font-family: inherit; font-size: inherit; color: inherit;
    background: none; border: none; cursor: pointer; padding: 0;
  }
  .fg-cards h1, .fg-cards h2, .fg-cards h3, .fg-cards h4, .fg-cards p, .fg-cards dl, .fg-cards dt, .fg-cards dd, .fg-cards ul {
    margin: 0; padding: 0;
  }
  .fg-cards ul { list-style: none; }

  /* ============ LAYOUT ============ */
  .fg-cards .fg-wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(32px, 5vw, 72px) clamp(20px, 5vw, 48px) clamp(48px, 6vw, 88px);

  /* ============ PAGE HEAD ============ */
  .fg-cards .fg-page-head {

  }
  .fg-cards .fg-page-head__label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brand-red);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .fg-cards .fg-page-head__title {
    font-weight: 600;
    font-size: 48px;
    letter-spacing: -0.025em;
    line-height: 1.05;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .fg-cards .fg-page-head__sub {
    font-size: 16px;
    color: var(--ink-soft);
    font-weight: 400;
    line-height: 1.5;
  }
  @media (max-width: 1100px) {
    .fg-cards .fg-page-head__title { font-size: 42px; }
  }
  @media (max-width: 880px) {
    .fg-cards .fg-page-head__title { font-size: 36px; }
    .fg-cards .fg-page-head { margin-bottom: 28px; }
  }
  @media (max-width: 480px) {
    .fg-cards .fg-page-head__title { font-size: 28px; }
    .fg-cards .fg-page-head__sub { font-size: 14px; }
  }

  /* ============ TOP-10 PLACEHOLDER ============ */
  .fg-cards .fg-top10 {
    margin: 0 0 48px 0;
    padding: 36px clamp(24px, 4vw, 44px);
    background: linear-gradient(180deg, var(--paper-warm) 0%, #f3eddc 100%);

  .fg-cards .fg-top10__title {

  /* ============ SECTION TITLE ============ */
  .fg-cards .fg-section-head {

    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;

  .fg-cards .fg-section-head__title {

    font-weight: 600;
    letter-spacing: -0.01em;

    color: var(--ink-faint);
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;

  /* Sort chips */
  .fg-cards .fg-sort {

    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    margin: 0 0 18px 0;
  }
  .fg-cards .fg-sort__label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin-right: 4px;

  .fg-cards .fg-sort__btn {
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--rule);

  .fg-cards .fg-sort__btn:hover {

    color: var(--ink);
  }
  .fg-cards .fg-sort__btn.is-active {
    background: var(--ink);

  }
  @media (max-width: 600px) {

    .fg-cards .fg-sort__btn { font-size: 12px; padding: 5px 10px; }
  }

  /* City filter chips (Юг) — внешний вид как у чипов сортировки */
  .fg-cards .fg-city {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    margin: 0 0 12px 0;
  }
  .fg-cards .fg-city[hidden] { display: none; }
  .fg-cards .fg-city__btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid var(--rule);
    border-radius: 2px;
    padding: 6px 12px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease;
    white-space: nowrap;
    display: inline-flex;
    align-items: baseline;
    gap: 6px;
  }
  .fg-cards .fg-city__count {
    font-size: 11px;
    opacity: 0.55;
    font-variant-numeric: tabular-nums;
  }
  .fg-cards .fg-city__btn:hover {
    border-color: var(--ink-faint);
    color: var(--ink);
  }
  .fg-cards .fg-city__btn.is-active {
    background: var(--ink);
    color: var(--paper-warm);
    border-color: var(--ink);
  }
  .fg-cards .fg-city__btn.is-active .fg-city__count { opacity: 0.8; }
  @media (max-width: 600px) {
    .fg-cards .fg-city { gap: 6px 8px; margin-bottom: 12px; }
    .fg-cards .fg-city__btn { font-size: 12px; padding: 5px 10px; }
  }

  /* ============ ENTRIES LIST ============ */
  .fg-cards .fg-entries {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .fg-cards .fg-entry {
    background: var(--paper-deep);
    border: 1px solid var(--rule);
    border-radius: 6px;
    transition: border-color 0.15s ease, box-shadow 0.2s ease;

  }
  .fg-cards .fg-entry:hover {
    border-color: var(--ink-faint);
    box-shadow: var(--shadow-card);
  }
  .fg-cards .fg-entry.is-open {
    border-color: var(--ink-soft);
    box-shadow: var(--shadow-card);
  }

  /* Card header (clickable) */
  .fg-cards .fg-entry__head {
    width: 100%;
    display: grid;
    grid-template-columns: 64px minmax(0, 1fr) auto;
    align-items: center;
    gap: 18px;
    padding: 18px 22px;
    cursor: pointer;
    text-align: left;
    background: transparent;
    transition: background-color 0.15s ease;
  }
  .fg-cards .fg-entry__right {
    display: flex;
    align-items: center;
    gap: 18px;
    justify-content: flex-end;
  }
  .fg-cards .fg-entry__head:hover { background: var(--paper-warm); }
  .fg-cards .fg-entry.is-open .fg-entry__head { background: var(--paper-warm); }

  .fg-cards .fg-entry__rank {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;

    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    text-align: center;
  }
  .fg-cards .fg-entry__name-block {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .fg-cards .fg-entry__cuisine {
    display: block;
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-faint);
    line-height: 1.2;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 2px;
  }
  .fg-cards .fg-entry__name {
    display: block;
    font-size: 19px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.25;
    letter-spacing: -0.01em;

  }
  .fg-cards .fg-entry__city {
    font-size: 0.68em;
    font-weight: 500;
    color: var(--ink-faint);
    letter-spacing: 0.01em;
    white-space: nowrap;
  }
  .fg-cards .fg-entry__city-sep {
    margin: 0 0.45em;
  }
  .fg-cards .fg-entry__brief {
    display: block;
    font-size: 13px;
    color: var(--ink-faint);
    line-height: 1.4;
    letter-spacing: 0.005em;
  }
  .fg-cards .fg-entry__brief b {
    color: var(--ink-soft);
    font-weight: 500;
  }
  .fg-cards .fg-entry__segment {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--ink-soft);
    padding: 6px 12px;
    background: var(--paper);
    border-radius: 2px;
    white-space: nowrap;
    letter-spacing: 0.08em;

  .fg-cards .fg-entry__segment.is-closed {

    padding-left: 11px;

  .fg-cards .fg-entry.is-closed-card .fg-entry__rank {
    color: var(--ink-faint);
  }
  .fg-cards .fg-entry.is-closed-card .fg-entry__name {
    text-decoration: line-through;
    text-decoration-color: var(--ink-faint);
    text-decoration-thickness: 1.5px;
  }
  .fg-cards .fg-entry.is-closed-card {
    opacity: 0.72;
  }
  .fg-cards .fg-entry.is-closed-card:hover { opacity: 0.9; }
  .fg-cards .fg-entry__chevron {
    color: var(--ink-faint);
    font-size: 22px;
    line-height: 1;
    transition: transform 0.2s ease, color 0.15s ease;
    text-align: center;
    font-weight: 300;
  }
  .fg-cards .fg-entry__head[aria-expanded="true"] .fg-entry__chevron {

  /* Card detail body */
  .fg-cards .fg-entry__detail {
    border-top: 1px solid var(--rule-soft);
    padding: 24px 26px 28px 84px;
    background: var(--paper-deep);

  /* Prices block (full width, accented) — sits at the bottom of the expand */
  .fg-cards .fg-detail-prices {
    grid-column: 1 / -1;

  .fg-cards .fg-detail-prices__label {
    font-size: 11px;

    color: var(--ink-faint);
    font-weight: 600;

  .fg-cards .fg-detail-prices__row {

  .fg-cards .fg-price__val {

  @media (max-width: 480px) {

  /* Contact footer — address + website, full width below prices */

  .fg-cards .fg-detail-block__title {

  /* Props (label : value rows) */

    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }
  .fg-cards .fg-prop {

  .fg-cards .fg-prop:last-child { border-bottom: none; padding-bottom: 0; }
  .fg-cards .fg-prop__key {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .fg-cards .fg-prop__val {
    font-size: 15px;
    font-weight: 600;

  .fg-cards .fg-prop__val small {
    font-size: 12px;

    color: var(--ink-faint);
    margin-left: 4px;

  }

  /* Horizontal bar chart — used for both card breakdown and BTG */
  .fg-cards .fg-bars {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .fg-cards .fg-bar {
    display: grid;
    grid-template-columns: 82px minmax(0, 1fr) 36px;
    align-items: center;
    gap: 12px;
  }
  .fg-cards .fg-bar__label {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.2;
  }
  .fg-cards .fg-bar.is-zero .fg-bar__label { color: #b85050; font-style: italic; }
  .fg-cards .fg-bar__track {
    display: block;
    height: 14px;
    background: #f1ece0;
    border: 1px solid rgba(0,0,0,0.05);
    border-radius: 3px;
    overflow: hidden;
  }
  .fg-cards .fg-bar.is-zero .fg-bar__track {
    background: #fce8e8;
    border-color: rgba(183, 36, 36, 0.20);
  }
  .fg-cards .fg-bar__fill {
    display: block;
    height: 100%;
    border-radius: 2px;
    transition: width 0.25s ease;
    min-width: 3px;
  }

<script>
(function () {
  "use strict";

  const root = document.querySelector(".fg-cards");
  const entriesEl = document.getElementById("fg-entries");
  const dataEl = document.getElementById("fg-cards-data");
  const titleEl = document.getElementById("fg-page-title");
  const subEl = document.getElementById("fg-page-sub");
  const countEl = document.getElementById("fg-count");

  let DATA = null;
  try {
    DATA = JSON.parse(dataEl.textContent);
  } catch (e) {
    console.error("fg-cards: failed to parse data", e);
    entriesEl.innerHTML = '<p style="color:#7a6f60; padding: 20px;">Не удалось загрузить данные рейтинга.</p>';
    return;
  }

  if (DATA.rating_title) titleEl.textContent = DATA.rating_title;
  if (DATA.rating_subtitle) subEl.textContent = DATA.rating_subtitle;
  if (countEl && Array.isArray(DATA.restaurants)) {
    countEl.textContent = DATA.restaurants.length + " " + pluralRu(DATA.restaurants.length, "карта", "карты", "карт");
  }

  function pluralRu(n, one, few, many) {
    const a = Math.abs(n) % 100;
    const b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtNum(n) {
    if (n === null || n === undefined || n === "") return "—";
    if (typeof n === "number") {
      return n.toLocaleString("ru-RU");
    }
    return String(n);
  }

  function fmtRub(n) {
    if (n === null || n === undefined || n === "") return "—";
    return Number(n).toLocaleString("ru-RU") + " ₽";
  }

  function isLeader(seg) {
    if (!seg) return false;
    return /Лидер/i.test(seg);
  }

  const BTG_COLORS = [
    { key: "red",       label: "Красное"   },
    { key: "white",     label: "Белое"     },
    { key: "rose",      label: "Розе"      },
    { key: "sparkling", label: "Игристое"  },
    { key: "orange",    label: "Оранж"     },
    { key: "sweet",     label: "Сладкое"   },
  ];

  function btgTotal(btg) {
    if (!btg) return 0;
    return BTG_COLORS.reduce(function (acc, c) {
      const v = btg[c.key];
      return acc + (typeof v === "number" ? v : 0);
    }, 0);
  }

  function buildBriefLine(r) {
    const parts = [];
    if (r.depth) parts.push("<b>" + escapeHtml(fmtNum(r.depth)) + "</b> " + pluralRu(r.depth, "вино", "вина", "вин"));
    const total = btgTotal(r.btg);
    if (total > 0) parts.push("<b>" + total + "</b> по бокалам");
    return parts.join(" · ");
  }

  function buildEntry(r, index) {
    const brief = buildBriefLine(r);
    const segLeader = isLeader(r.segment);
    const btgTotalN = btgTotal(r.btg);

    const sommelierRow = (function () {
      const raw = r.sommelier && String(r.sommelier).trim();
      if (!raw) return '';
      const display = /^[—–-]+$/.test(raw) ? 'нет' : raw;
      const cls = /^[—–-]+$/.test(raw) ? ' fg-prop__val--empty' : '';
      return '<div class="fg-prop"><dt class="fg-prop__key">Сомелье</dt><dd class="fg-prop__val' + cls + '">' + escapeHtml(display) + '</dd></div>';
    })();

    const autochVal = (function () {
      if (!r.autochthons) return '<dd class="fg-prop__val">—</dd>';
      const parts = String(r.autochthons).split(":").map(function (s) { return s.trim(); });
      if (parts.length === 2) {
        const sortN = Number(parts[0]);
        const bottN = Number(parts[1]);
        const sortWord = !isNaN(sortN) ? pluralRu(sortN, "сорт", "сорта", "сортов") : "сорта";
        const bottWord = !isNaN(bottN) ? pluralRu(bottN, "вино", "вина", "вин") : "вина";
        return '<dd class="fg-prop__val">' + escapeHtml(parts[0]) + ' <small>' + sortWord + '</small> · ' + escapeHtml(parts[1]) + ' <small>' + bottWord + '</small></dd>';
      }
      return '<dd class="fg-prop__val">' + escapeHtml(r.autochthons) + '</dd>';
    })();

    function renderBars(source) {
      const max = BTG_COLORS.reduce(function (m, c) {
        const v = Number(source && source[c.key]) || 0;
        return v > m ? v : m;
      }, 0);
      return '<div class="fg-bars">' + BTG_COLORS.map(function (c) {
        const n = Number(source && source[c.key]) || 0;
        const cls = n === 0 ? ' is-zero' : '';
        const pct = max > 0 ? Math.max(2, (n / max) * 100) : 0;
        return '<div class="fg-bar' + cls + '">' +
          '<span class="fg-bar__label">' + escapeHtml(c.label) + '</span>' +
          '<span class="fg-bar__track"><span class="fg-bar__fill fg-bar__fill--' + c.key + '" style="width:' + pct + '%"></span></span>' +
          '<span class="fg-bar__count">' + n + '</span>' +
        '</div>';
      }).join('') + '</div>';
    }

    const cardBreakdownTotal = r.card_breakdown
      ? BTG_COLORS.reduce(function (a, c) { return a + (Number(r.card_breakdown[c.key]) || 0); }, 0)
      : 0;
    const cardBarsHtml = cardBreakdownTotal > 0 ? renderBars(r.card_breakdown) : '';

    const btgBarsHtml = btgTotalN > 0
      ? renderBars(r.btg)
      : '<p class="fg-btg-empty">Карта рассчитана на бутылочный заказ</p>';

    const descHtml = r.description && String(r.description).trim()
      ? '<div class="fg-detail-desc"><p>' + escapeHtml(r.description) + '</p></div>'
      : '';

    const hasGlass = r.median_glass_rub !== null && r.median_glass_rub !== undefined && r.median_glass_rub !== '';
    const hasBottle = r.median_bottle_rub !== null && r.median_bottle_rub !== undefined && r.median_bottle_rub !== '';
    const priceHtml = (hasGlass || hasBottle)
      ? '<div class="fg-detail-prices">' +
          '<div class="fg-detail-prices__label">Ориентировочные цены</div>' +
          '<div class="fg-detail-prices__row">' +
            (hasGlass
              ? '<div class="fg-price"><span class="fg-price__key">Бокал</span><span class="fg-price__val">' + escapeHtml(fmtRub(r.median_glass_rub)) + '</span></div>'
              : '') +
            (hasBottle
              ? '<div class="fg-price"><span class="fg-price__key">Бутылка</span><span class="fg-price__val">' + escapeHtml(fmtRub(r.median_bottle_rub)) + '</span></div>'
              : '') +
          '</div>' +
        '</div>'
      : '';

    const addr = r.address && String(r.address).trim();
    const web = r.website && String(r.website).trim();
    let contactsHtml = '';
    if (addr || web) {
      const parts = [];
      if (addr) {
        const fullAddr = addr; // Юг: адрес в данных уже с городом
        parts.push('<span class="fg-contact__val">' + escapeHtml(fullAddr) + '</span>');
      }
      if (web) {
        const url = String(web);
        const safeUrl = /^https?:\/\//i.test(url) ? url : 'https://' + url;
        const display = url.replace(/^https?:\/\//i, '').replace(/\/$/, '');
        parts.push('<a class="fg-contact__val" href="' + escapeHtml(safeUrl) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(display) + '</a>');
      }
      contactsHtml = '<div class="fg-detail-contacts">' + parts.join('<span class="fg-contact__sep" aria-hidden="true">·</span>') + '</div>';
    }

    const detailHtml =
      '<div class="fg-entry__detail" hidden>' +
        descHtml +
        '<div class="fg-detail-block">' +
          '<h4 class="fg-detail-block__title">Разделы карты' + (r.depth ? ' · ' + escapeHtml(fmtNum(r.depth)) + ' ' + pluralRu(r.depth, "вино", "вина", "вин") : '') + '</h4>' +
          cardBarsHtml +
        '</div>' +
        '<div class="fg-detail-block">' +
          '<h4 class="fg-detail-block__title">Бокальная программа' + (btgTotalN > 0 ? ' · ' + btgTotalN + ' ' + pluralRu(btgTotalN, "позиция", "позиции", "позиций") : '') + '</h4>' +
          btgBarsHtml +
        '</div>' +
        '<div class="fg-detail-block fg-detail-block--full">' +
          '<h4 class="fg-detail-block__title">О карте</h4>' +
          '<dl class="fg-props">' +
            sommelierRow +
            '<div class="fg-prop"><dt class="fg-prop__key">Всего вин</dt><dd class="fg-prop__val">' + escapeHtml(fmtNum(r.depth)) + '</dd></div>' +
            '<div class="fg-prop"><dt class="fg-prop__key">Сорта винограда</dt><dd class="fg-prop__val">' + escapeHtml(fmtNum(r.mono_grapes)) + '</dd></div>' +
            '<div class="fg-prop"><dt class="fg-prop__key">Бленды</dt><dd class="fg-prop__val">' + escapeHtml(fmtNum(r.blends)) + '</dd></div>' +
            '<div class="fg-prop"><dt class="fg-prop__key">Винодельни</dt><dd class="fg-prop__val">' + escapeHtml(fmtNum(r.producers)) + '</dd></div>' +
            '<div class="fg-prop"><dt class="fg-prop__key">ЗГУ</dt><dd class="fg-prop__val">' + escapeHtml(fmtNum(r.regions)) + '</dd></div>' +
            '<div class="fg-prop"><dt class="fg-prop__key">Российские автохтоны</dt>' + autochVal + '</div>' +
            (r.sparkling_subtypes ? '<div class="fg-prop"><dt class="fg-prop__key">Стили игристых</dt><dd class="fg-prop__val">' + escapeHtml(String(r.sparkling_subtypes).split('/')[0].trim()) + '</dd></div>' : '') +
          '</dl>' +
        '</div>' +
        priceHtml +
        contactsHtml +
      '</div>';

    // A closed restaurant shows a grey "Закрыт" slab; it wins over a nomination
    const nomHtml = r.closed
      ? '<span class="fg-entry__segment is-closed">Закрыт</span>'
      : (r.nomination && String(r.nomination).trim()
          ? '<span class="fg-entry__segment is-leader">' + escapeHtml(r.nomination) + '</span>'
          : '');

    return (
      '<article class="fg-entry' + (r.closed ? ' is-closed-card' : '') + '" data-rank="' + escapeHtml(String(r.rank)) + '">' +
        '<button class="fg-entry__head" aria-expanded="false" type="button">' +
          '<span class="fg-entry__rank">' + escapeHtml(String(r.rank)) + '</span>' +
          '<span class="fg-entry__name-block">' +
            (r.cuisine ? '<span class="fg-entry__cuisine">' + escapeHtml(r.cuisine) + '</span>' : '') +
            '<span class="fg-entry__name">' + escapeHtml(r.name || '') + (r.city ? '<span class="fg-entry__city"><span class="fg-entry__city-sep" aria-hidden="true">·</span>' + escapeHtml(r.city) + '</span>' : '') + '</span>' +
            (brief ? '<span class="fg-entry__brief">' + brief + '</span>' : '') +
          '</span>' +
          '<span class="fg-entry__right">' +
            nomHtml +
            '<span class="fg-entry__chevron" aria-hidden="true">⌄</span>' +
          '</span>' +
        '</button>' +
        detailHtml +
      '</article>'
    );
  }

  // Each sort has an extractor; direction is applied per-key in render()
  const SORT_KEYS = {
    rank:   function (r) { return r.rank || Infinity; },
    glass:  function (r) { return (r.median_glass_rub  != null && r.median_glass_rub  !== "") ? Number(r.median_glass_rub)  : Infinity; },
    bottle: function (r) { return (r.median_bottle_rub != null && r.median_bottle_rub !== "") ? Number(r.median_bottle_rub) : Infinity; },
    depth:  function (r) { return r.depth || 0; },
  };
  // Default direction for each key (used on first activation)
  // depth is naturally desc (more wine first); the rest asc.
  const sortDir = { rank: "asc", glass: "asc", bottle: "asc", depth: "desc" };
  let currentSort = "rank";

  function render() {
    if (!DATA || !Array.isArray(DATA.restaurants)) {
      entriesEl.innerHTML = '';
      return;
    }
    const extract = SORT_KEYS[currentSort] || SORT_KEYS.rank;
    const dirMul = (sortDir[currentSort] === "desc") ? -1 : 1;
    const sorted = DATA.restaurants.filter(cityMatch).sort(function (a, b) {
      return (extract(a) - extract(b)) * dirMul;
    });
    entriesEl.innerHTML = sorted.map(buildEntry).join("");

    entriesEl.querySelectorAll(".fg-entry").forEach(function (entry) {
      const head = entry.querySelector(".fg-entry__head");
      const detail = entry.querySelector(".fg-entry__detail");
      head.addEventListener("click", function () {
        const expanded = head.getAttribute("aria-expanded") === "true";
        head.setAttribute("aria-expanded", expanded ? "false" : "true");
        if (expanded) {
          detail.setAttribute("hidden", "");
          entry.classList.remove("is-open");
        } else {
          detail.removeAttribute("hidden");
          entry.classList.add("is-open");
        }
        sendHeightToParent();
      });
    });

    sendHeightToParent();
  }

  /* ============ City filter (Юг) ============ */
  // Чипы строятся из данных: «Все» + города по числу ресторанов (при равенстве — по лучшему месту).
  // Выбор одного города; повторный клик по активному городу или «Все» — сброс.
  // Места (rank) при фильтре не перенумеровываются: это места в рейтинге.
  // Предвыбор города для встраивания: wine-cards-south.html?city=Сочи
  const cityEl = document.getElementById("fg-city-filter");
  let currentCity = "";
  function cityMatch(r) { return !currentCity || (r.city || "") === currentCity; }
  (function buildCityFilter() {
    if (!cityEl || !DATA || !Array.isArray(DATA.restaurants)) return;
    const stat = {};
    DATA.restaurants.forEach(function (r) {
      const c = r.city || "";
      if (!c) return;
      if (!stat[c]) stat[c] = { n: 0, best: Infinity };
      stat[c].n += 1;
      stat[c].best = Math.min(stat[c].best, r.rank || Infinity);
    });
    const cities = Object.keys(stat).sort(function (a, b) {
      return (stat[b].n - stat[a].n) || (stat[a].best - stat[b].best);
    });
    if (cities.length < 2) { cityEl.hidden = true; return; }
    let wanted = "";
    try { wanted = new URLSearchParams(window.location.search).get("city") || ""; } catch (e) {}
    if (wanted && stat[wanted]) currentCity = wanted;
    const chips = [{ key: "", label: "Все", n: DATA.restaurants.length }].concat(
      cities.map(function (c) { return { key: c, label: c, n: stat[c].n }; }));
    cityEl.insertAdjacentHTML("beforeend", chips.map(function (c) {
      const on = c.key === currentCity;
      return '<button class="fg-city__btn' + (on ? ' is-active' : '') + '" data-city="' + escapeHtml(c.key) +
        '" type="button" aria-pressed="' + (on ? 'true' : 'false') + '">' + escapeHtml(c.label) +
        '<span class="fg-city__count">' + c.n + '</span></button>';
    }).join(""));
    cityEl.addEventListener("click", function (e) {
      const btn = e.target && e.target.closest ? e.target.closest(".fg-city__btn") : null;
      if (!btn) return;
      const key = btn.getAttribute("data-city") || "";
      currentCity = (key === currentCity) ? "" : key;
      cityEl.querySelectorAll(".fg-city__btn").forEach(function (b) {
        const on = (b.getAttribute("data-city") || "") === currentCity;
        b.classList.toggle("is-active", on);
        b.setAttribute("aria-pressed", on ? "true" : "false");
      });
      render();
    });
  })();

  /* ============ Sort controls ============ */
  const sortButtons = root.querySelectorAll(".fg-sort__btn");
  function updateSortUI() {
    sortButtons.forEach(function (b) {
      const k = b.getAttribute("data-sort");
      b.classList.toggle("is-active", k === currentSort);
      const arrow = b.querySelector(".fg-sort__arrow");
      if (arrow) arrow.textContent = (sortDir[k] === "desc") ? "↓" : "↑";
    });
  }
  sortButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      const key = btn.getAttribute("data-sort");
      if (!key || !(key in SORT_KEYS)) return;
      if (key === currentSort) {
        // Same sort clicked → flip direction
        sortDir[key] = (sortDir[key] === "desc") ? "asc" : "desc";
      } else {
        currentSort = key;
      }
      updateSortUI();
      render();
    });
  });

  /* ============ iframe-friendly (Tilda T123) ============ */
  // Use .fg-cards' OWN content height — never documentElement.scrollHeight,
  // which grows to match the viewport (the iframe) and causes a runaway loop:
  //   parent sets iframe.height = h+8 → documentElement.scrollHeight = h+8 →
  //   next message also h+8 (then +16, +24…). With root.scrollHeight, the
  //   reported height is the layout size of the content, independent of the
  //   iframe viewport.
  let lastSentHeight = 0;
  function sendHeightToParent() {
    if (window.parent === window) return;
    const node = root || document.querySelector(".fg-cards") || document.body;
    if (!node) return;
    const h = node.scrollHeight || node.offsetHeight || 0;
    if (!h || Math.abs(h - lastSentHeight) < 4) return;
    lastSentHeight = h;
    try {
      window.parent.postMessage({ type: "fg-cards-south-height", height: h }, "*");
    } catch (e) {}
  }

  if (typeof ResizeObserver !== "undefined") {
    try {
      const ro = new ResizeObserver(function () { sendHeightToParent(); });
      ro.observe(root);
    } catch (e) {}
  }
  window.addEventListener("load", sendHeightToParent);
  window.addEventListener("resize", sendHeightToParent);
  window.addEventListener("message", function (e) {
    if (e && e.data && e.data.type === "fg-cards-request-height") {
      lastSentHeight = 0; // force re-send
      sendHeightToParent();
    }
  });

  render();
})();
</script>

</body>
</html>
