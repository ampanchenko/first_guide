<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Лучшие карты российского вина · Первый Гид</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

<!--
========================================================================
  ЛУЧШИЕ РОССИЙСКИЕ ВИННЫЕ КАРТЫ · ПЕРВЫЙ ГИД
  Self-contained HTML block. Paste into Tilda T123 (HTML) container.

  Чтобы обновить данные:
    Замените содержимое <script id="fg-cards-data"> на свежий JSON.
    Формат: {"rating_title": "...", "rating_subtitle": "...", "restaurants": [...]}

  Поля ресторана:
    rank          — место (1..50)
    name          — название
    segment       — "🏆 Лидер" или "🥇 Топ-50" (на странице сейчас НЕ показывается)
    nomination    — текст спец-шильдика; если пусто — плашка не рисуется
    description   — литературное описание карты
    sommelier     — имя шеф-сомелье (string; если пусто — строка не показывается)
    depth         — бутылок в карте (Глубина)
    mono_grapes   — моно-сортовых вин
    blends        — бленды
    producers     — хозяйств
    regions       — регионов ЗГУ
    types_in_card — "n/6" типов вин в карте
    autochthons   — "сорта : бутылки" автохтонов
    card_breakdown — {red, white, rose, sparkling, orange, sweet} — состав карты по цветам
    btg           — {red, white, rose, sparkling, orange, sweet} — БТГ по цветам
    btg_types_count — "n/6" типов в БТГ
    median_glass_rub  — медиана бокала, ₽
    median_bottle_rub — медиана бутылки, ₽
    address        — почтовый адрес (string; если пусто — строка скрыта)
    website        — URL сайта (string; если пусто — ссылка скрыта)
========================================================================
-->

<style>
  /* ============ NAMESPACED RESET ============ */
  .fg-cards *,
  .fg-cards *::before,
  .fg-cards *::after {
    box-sizing: border-box;
  }
  .fg-cards {
    --ink: #1a1614;
    --ink-soft: #4a4035;
    --ink-faint: #7a6f60;
    --paper: #cac4b0;
    --paper-warm: #ede7d3;
    --paper-deep: #ffffff;
    --rule: #a8a08a;
    --rule-soft: #cfc6ad;
    --wine: #b72424;
    --wine-soft: #cf3a3a;
    --brand-red: #b72424;
    --gold: #a57430;
    --green: #4a7847;
    --rose: #d97a8f;
    --orange-tint: #d68a3a;
    --shadow: 0 1px 2px rgba(0, 0, 0, .06), 0 8px 24px rgba(0, 0, 0, .10);
    --shadow-card: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .07);

    font-family: "Montserrat", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.55;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "kern", "liga", "calt";
  }
  .fg-cards a { color: inherit; text-decoration: none; }
  .fg-cards button {
    font-family: inherit; font-size: inherit; color: inherit;
    background: none; border: none; cursor: pointer; padding: 0;
  }
  .fg-cards h1, .fg-cards h2, .fg-cards h3, .fg-cards h4, .fg-cards p, .fg-cards dl, .fg-cards dt, .fg-cards dd, .fg-cards ul {
    margin: 0; padding: 0;
  }
  .fg-cards ul { list-style: none; }

  /* ============ LAYOUT ============ */
  .fg-cards .fg-wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: clamp(32px, 5vw, 72px) clamp(20px, 5vw, 48px) clamp(48px, 6vw, 88px);
  }

  /* ============ PAGE HEAD ============ */
  .fg-cards .fg-page-head {
    margin: 0 0 36px 0;
  }
  .fg-cards .fg-page-head__label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brand-red);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .fg-cards .fg-page-head__title {
    font-weight: 600;
    font-size: 48px;
    letter-spacing: -0.025em;
    line-height: 1.05;
    color: var(--ink);
    margin-bottom: 14px;
  }
  .fg-cards .fg-page-head__sub {
    font-size: 16px;
    color: var(--ink-soft);
    font-weight: 400;
    line-height: 1.5;
  }
  @media (max-width: 1100px) {
    .fg-cards .fg-page-head__title { font-size: 42px; }
  }
  @media (max-width: 880px) {
    .fg-cards .fg-page-head__title { font-size: 36px; }
    .fg-cards .fg-page-head { margin-bottom: 28px; }
  }
  @media (max-width: 480px) {
    .fg-cards .fg-page-head__title { font-size: 28px; }
    .fg-cards .fg-page-head__sub { font-size: 14px; }
  }

  /* ============ TOP-10 PLACEHOLDER ============ */
  .fg-cards .fg-top10 {
    margin: 0 0 48px 0;
    padding: 36px clamp(24px, 4vw, 44px);
    background: linear-gradient(180deg, var(--paper-warm) 0%, #f3eddc 100%);
    border: 1px solid var(--rule);
    border-radius: 6px;
    position: relative;
    overflow: hidden;
  }
  .fg-cards .fg-top10::before {
    content: "";
    position: absolute;
    top: 0; left: 0; bottom: 0;
    width: 4px;
    background: var(--brand-red);
  }
  .fg-cards .fg-top10__label {
    display: inline-block;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--brand-red);
    font-weight: 700;
    margin-bottom: 10px;
  }
  .fg-cards .fg-top10__title {
    font-size: 26px;
    font-weight: 600;
    line-height: 1.2;
    margin-bottom: 12px;
    color: var(--ink);
    letter-spacing: -0.015em;
  }
  .fg-cards .fg-top10__hint {
    font-size: 15px;
    color: var(--ink-soft);
    max-width: 720px;
    line-height: 1.55;
  }
  @media (max-width: 480px) {
    .fg-cards .fg-top10 { padding: 26px 22px; margin-bottom: 36px; }
    .fg-cards .fg-top10__title { font-size: 22px; }
    .fg-cards .fg-top10__hint { font-size: 14px; }
  }

  /* ============ SECTION TITLE ============ */
  .fg-cards .fg-section-head {
    margin: 0 0 24px 0;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .fg-cards .fg-section-head__title {
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .fg-cards .fg-section-head__count {
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
  }

  /* ============ ENTRIES LIST ============ */
  .fg-cards .fg-entries {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .fg-cards .fg-entry {
    background: var(--paper-deep);
    border: 1px solid var(--rule);
    border-radius: 6px;
    transition: border-color 0.15s ease, box-shadow 0.2s ease;
    overflow: hidden;
  }
  .fg-cards .fg-entry:hover {
    border-color: var(--ink-faint);
    box-shadow: var(--shadow-card);
  }
  .fg-cards .fg-entry.is-open {
    border-color: var(--ink-soft);
    box-shadow: var(--shadow-card);
  }

  /* Card header (clickable) */
  .fg-cards .fg-entry__head {
    width: 100%;
    display: grid;
    grid-template-columns: 64px 1fr auto 28px;
    align-items: center;
    gap: 18px;
    padding: 18px 22px;
    cursor: pointer;
    text-align: left;
    background: transparent;
    transition: background-color 0.15s ease;
  }
  .fg-cards .fg-entry__head:hover { background: var(--paper-warm); }
  .fg-cards .fg-entry.is-open .fg-entry__head { background: var(--paper-warm); }

  .fg-cards .fg-entry__rank {
    font-size: 28px;
    font-weight: 700;
    line-height: 1;
    color: var(--brand-red);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    text-align: center;
  }
  .fg-cards .fg-entry__name-block {
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .fg-cards .fg-entry__name {
    display: block;
    font-size: 19px;
    font-weight: 600;
    color: var(--ink);
    line-height: 1.25;
    letter-spacing: -0.01em;
    word-break: break-word;
  }
  .fg-cards .fg-entry__brief {
    display: block;
    font-size: 13px;
    color: var(--ink-faint);
    line-height: 1.4;
    letter-spacing: 0.005em;
  }
  .fg-cards .fg-entry__brief b {
    color: var(--ink-soft);
    font-weight: 500;
  }
  .fg-cards .fg-entry__segment {
    font-size: 12px;
    font-weight: 500;
    color: var(--ink-soft);
    padding: 5px 11px;
    background: var(--paper);
    border-radius: 100px;
    white-space: nowrap;
    letter-spacing: 0.02em;
  }
  .fg-cards .fg-entry__segment.is-leader {
    color: var(--brand-red);
    background: rgba(183, 36, 36, 0.08);
  }
  .fg-cards .fg-entry__chevron {
    color: var(--ink-faint);
    font-size: 22px;
    line-height: 1;
    transition: transform 0.2s ease, color 0.15s ease;
    text-align: center;
    font-weight: 300;
  }
  .fg-cards .fg-entry__head[aria-expanded="true"] .fg-entry__chevron {
    transform: rotate(180deg);
    color: var(--ink-soft);
  }

  /* Card detail body */
  .fg-cards .fg-entry__detail {
    border-top: 1px solid var(--rule-soft);
    padding: 24px 26px 28px 84px;
    background: var(--paper-deep);
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 26px 36px;
  }
  .fg-cards .fg-entry__detail[hidden] { display: none; }
  .fg-cards .fg-detail-desc {
    grid-column: 1 / -1;
    font-size: 15px;
    line-height: 1.65;
    color: var(--ink-soft);
    padding: 0 0 4px 0;
    border-left: 3px solid var(--brand-red);
    padding-left: 18px;
    margin-bottom: 2px;
  }
  .fg-cards .fg-detail-desc p { margin: 0; }

  /* Prices block (full width, accented) — sits at the bottom of the expand */
  .fg-cards .fg-detail-prices {
    grid-column: 1 / -1;
    background: var(--paper-warm);
    border: 1px solid var(--rule-soft);
    border-radius: 6px;
    padding: 16px 22px 18px;
    margin: 6px 0 0;
  }
  .fg-cards .fg-detail-prices__label {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin-bottom: 10px;
  }
  .fg-cards .fg-detail-prices__row {
    display: flex;
    flex-wrap: wrap;
    gap: 24px 56px;
    align-items: baseline;
  }
  .fg-cards .fg-price {
    display: flex;
    align-items: baseline;
    gap: 12px;
    min-width: 0;
  }
  .fg-cards .fg-price__key {
    font-size: 14px;
    color: var(--ink-soft);
    font-weight: 500;
  }
  .fg-cards .fg-price__val {
    font-size: 22px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  @media (max-width: 480px) {
    .fg-cards .fg-detail-prices { padding: 14px 16px 16px; }
    .fg-cards .fg-detail-prices__row { gap: 14px 32px; }
    .fg-cards .fg-price__val { font-size: 20px; }
  }

  /* Contact footer — address + website, full width below prices */
  .fg-cards .fg-detail-contacts {
    grid-column: 1 / -1;
    margin: 14px 0 0;
    padding-top: 12px;
    border-top: 1px solid var(--rule-soft);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 12px;
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.45;
  }
  .fg-cards .fg-contact__val {
    color: var(--ink-soft);
    font-weight: 400;
    overflow-wrap: anywhere;
  }
  .fg-cards a.fg-contact__val {
    color: var(--wine);
    text-decoration: underline;
    text-decoration-color: rgba(183, 36, 36, 0.3);
    text-underline-offset: 3px;
    transition: text-decoration-color 0.15s ease;
  }
  .fg-cards a.fg-contact__val:hover {
    text-decoration-color: var(--wine);
  }
  .fg-cards .fg-contact__sep {
    color: var(--ink-faint);
    user-select: none;
  }
  @media (max-width: 480px) {
    .fg-cards .fg-detail-contacts { flex-direction: column; gap: 6px; font-size: 13px; }
    .fg-cards .fg-contact__sep { display: none; }
  }

  .fg-cards .fg-detail-block__title {
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    font-weight: 600;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--rule-soft);
  }

  /* Props (label : value rows) */
  .fg-cards .fg-props {
    display: grid;
    grid-template-columns: minmax(0, 1fr);
    gap: 10px;
  }
  .fg-cards .fg-prop {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    gap: 14px;
    align-items: baseline;
    padding-bottom: 8px;
    border-bottom: 1px dotted var(--rule-soft);
  }
  .fg-cards .fg-prop:last-child { border-bottom: none; padding-bottom: 0; }
  .fg-cards .fg-prop__key {
    font-size: 14px;
    color: var(--ink-soft);
    line-height: 1.4;
  }
  .fg-cards .fg-prop__val {
    font-size: 15px;
    font-weight: 600;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.005em;
    text-align: right;
    overflow-wrap: anywhere;
    min-width: 0;
  }
  .fg-cards .fg-prop__val--empty {
    color: var(--ink-faint);
    font-weight: 400;
    font-style: italic;
    font-size: 14px;
  }
  .fg-cards .fg-prop__val small {
    font-size: 12px;
    font-weight: 400;
    color: var(--ink-faint);
    margin-left: 4px;
    letter-spacing: 0.02em;
  }

  /* Horizontal bar chart — used for both card breakdown and BTG */
  .fg-cards .fg-bars {
    display: flex;
    flex-direction: column;
    gap: 9px;
  }
  .fg-cards .fg-bar {
    display: grid;
    grid-template-columns: 82px minmax(0, 1fr) 36px;
    align-items: center;
    gap: 12px;
  }
  .fg-cards .fg-bar__label {
    font-size: 13px;
    color: var(--ink-soft);
    line-height: 1.2;
  }
  .fg-cards .fg-bar.is-zero .fg-bar__label { color: #b85050; font-style: italic; }
  .fg-cards .fg-bar__track {
    display: block;
    height: 14px;
    background: #f1ece0;
    border: 1px solid rgba(0,0,0,0.05);
    border-radius: 3px;
    overflow: hidden;
  }
  .fg-cards .fg-bar.is-zero .fg-bar__track {
    background: #fce8e8;
    border-color: rgba(183, 36, 36, 0.20);
  }
  .fg-cards .fg-bar__fill {
    display: block;
    height: 100%;
    border-radius: 2px;
    transition: width 0.25s ease;
    min-width: 3px;
  }
  .fg-cards .fg-bar.is-zero .fg-bar__fill { min-width: 0; background: transparent !important; border: none !important; }
  /* Bright, distinguishable palette per colour */
  .fg-cards .fg-bar__fill--red       { background: #8a2a2a; }
  .fg-cards .fg-bar__fill--white     { background: #f0d65a; }
  .fg-cards .fg-bar__fill--rose      { background: #e07090; }
  .fg-cards .fg-bar__fill--sparkling { background: #fbf3b8; border: 1px solid #c9a630; box-sizing: border-box; }
  .fg-cards .fg-bar__fill--orange    { background: #e08a2e; }
  .fg-cards .fg-bar__fill--sweet     { background: #b8501a; }
  .fg-cards .fg-bar__count {
    font-size: 15px;
    font-weight: 700;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .fg-cards .fg-bar.is-zero .fg-bar__count { color: #b85050; font-weight: 500; }

  .fg-cards .fg-btg-empty {
    font-size: 14px;
    color: var(--ink-faint);
    font-style: italic;
    line-height: 1.5;
  }

  /* Full-width block (used for "О карте" props below the two color charts) */
  .fg-cards .fg-detail-block--full { grid-column: 1 / -1; }
  .fg-cards .fg-detail-block--full .fg-props {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px 36px;
  }
  @media (max-width: 880px) {
    .fg-cards .fg-bar { grid-template-columns: 74px minmax(0, 1fr) 32px; gap: 10px; }
    .fg-cards .fg-detail-block--full .fg-props { grid-template-columns: minmax(0, 1fr); }
    /* Fix label width so a long value (e.g. multi-name sommelier) can't crush it */
    .fg-cards .fg-prop { grid-template-columns: 140px minmax(0, 1fr); gap: 14px; }
  }
  @media (max-width: 480px) {
    .fg-cards .fg-bar { grid-template-columns: 70px minmax(0, 1fr) 28px; gap: 8px; }
    .fg-cards .fg-bar__label { font-size: 12px; }
    .fg-cards .fg-bar__count { font-size: 13px; }
    .fg-cards .fg-prop { grid-template-columns: 120px minmax(0, 1fr); gap: 10px; }
    .fg-cards .fg-prop__key { font-size: 13px; }
    .fg-cards .fg-prop__val { font-size: 14px; }
  }

  /* Mini sub-block: card breakdown by colour */
  .fg-cards .fg-card-breakdown {
    margin-top: 18px;
  }
  .fg-cards .fg-card-breakdown__head {
    font-size: 13px;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 12px;
    letter-spacing: 0.005em;
  }

  /* Responsive: tablet */
  @media (max-width: 880px) {
    .fg-cards .fg-entry__head {
      grid-template-columns: 48px 1fr 24px;
      gap: 14px;
      padding: 16px 18px;
    }
    .fg-cards .fg-entry__rank { font-size: 24px; }
    .fg-cards .fg-entry__name { font-size: 17px; }
    .fg-cards .fg-entry__brief { font-size: 12px; }
    .fg-cards .fg-entry__segment {
      grid-column: 2;
      grid-row: 2;
      justify-self: start;
      margin-top: 4px;
    }
    .fg-cards .fg-entry__chevron { grid-column: 3; grid-row: 1; align-self: center; }
    .fg-cards .fg-entry__detail {
      grid-template-columns: minmax(0, 1fr);
      gap: 22px;
      padding: 22px 18px 24px;
    }
  }

  /* Responsive: mobile */
  @media (max-width: 480px) {
    .fg-cards .fg-entry__head {
      grid-template-columns: 40px 1fr 20px;
      gap: 12px;
      padding: 14px 14px;
    }
    .fg-cards .fg-entry__rank { font-size: 22px; }
    .fg-cards .fg-entry__name { font-size: 16px; }
    .fg-cards .fg-entry__brief { font-size: 12px; }
    .fg-cards .fg-entry__detail { padding: 20px 14px 22px; gap: 18px; }
    .fg-cards .fg-btg { grid-template-columns: minmax(0, 1fr); }
    .fg-cards .fg-prop__val { font-size: 14px; }
    .fg-cards .fg-prop__key { font-size: 13px; }
  }

  /* Footer note */
  .fg-cards .fg-footnote {
    margin-top: 40px;
    padding-top: 22px;
    border-top: 1px solid var(--rule);
    font-size: 13px;
    color: var(--ink-faint);
    line-height: 1.55;
  }
  .fg-cards .fg-footnote a {
    color: var(--wine);
    text-decoration: underline;
    text-decoration-color: rgba(183, 36, 36, 0.3);
    text-underline-offset: 3px;
  }
  .fg-cards .fg-footnote a:hover {
    text-decoration-color: var(--wine);
  }
</style>
</head>
<body>

<div class="fg-cards">
  <div class="fg-wrap">

    <header class="fg-page-head">
      <span class="fg-page-head__label" id="fg-page-label">Рейтинг</span>
      <h1 class="fg-page-head__title" id="fg-page-title">Лучшие карты российского вина</h1>
      <p class="fg-page-head__sub" id="fg-page-sub">Москва · весна 2026</p>
    </header>

    <section class="fg-section">
      <div class="fg-section-head">
        <h2 class="fg-section-head__title">Все карты рейтинга</h2>
        <span class="fg-section-head__count" id="fg-count">50 карт</span>
      </div>
      <div class="fg-entries" id="fg-entries"></div>
    </section>

    <p class="fg-footnote">
      Рейтинг построен по методологии Wine Scoring v5.22 (19 балльных блоков, 100-балльная шкала). На карточках показан срез ключевых характеристик карты — детали и баллы доступны в полной методике.
    </p>

  </div>

<script>
(function () {
  "use strict";

  const root = document.querySelector(".fg-cards");
  const entriesEl = document.getElementById("fg-entries");
  const dataEl = document.getElementById("fg-cards-data");
  const titleEl = document.getElementById("fg-page-title");
  const subEl = document.getElementById("fg-page-sub");
  const countEl = document.getElementById("fg-count");

  let DATA = null;
  try {
    DATA = JSON.parse(dataEl.textContent);
  } catch (e) {
    console.error("fg-cards: failed to parse data", e);
    entriesEl.innerHTML = '<p style="color:#7a6f60; padding: 20px;">Не удалось загрузить данные рейтинга.</p>';
    return;
  }

  if (DATA.rating_title) titleEl.textContent = DATA.rating_title;
  if (DATA.rating_subtitle) subEl.textContent = DATA.rating_subtitle;
  if (Array.isArray(DATA.restaurants)) {
    countEl.textContent = DATA.restaurants.length + " " + pluralRu(DATA.restaurants.length, "карта", "карты", "карт");
  }

  function pluralRu(n, one, few, many) {
    const a = Math.abs(n) % 100;
    const b = a % 10;
    if (a > 10 && a < 20) return many;
    if (b > 1 && b < 5) return few;
    if (b === 1) return one;
    return many;
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) return "";
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function fmtNum(n) {
    if (n === null || n === undefined || n === "") return "—";
    if (typeof n === "number") {
      return n.toLocaleString("ru-RU");
    }
    return String(n);
  }

  function fmtRub(n) {
    if (n === null || n === undefined || n === "") return "—";
    return Number(n).toLocaleString("ru-RU") + " ₽";
  }

  function isLeader(seg) {
    if (!seg) return false;
    return /Лидер/i.test(seg);
  }

  const BTG_COLORS = [
    { key: "red",       label: "Красное"   },
    { key: "white",     label: "Белое"     },
    { key: "rose",      label: "Розе"      },
    { key: "sparkling", label: "Игристое"  },
    { key: "orange",    label: "Оранж"     },
    { key: "sweet",     label: "Сладкое"   },
  ];

  function btgTotal(btg) {
    if (!btg) return 0;
    return BTG_COLORS.reduce(function (acc, c) {
      const v = btg[c.key];
      return acc + (typeof v === "number" ? v : 0);
    }, 0);
  }

  function buildBriefLine(r) {
    const parts = [];
    if (r.depth) parts.push("<b>" + escapeHtml(fmtNum(r.depth)) + "</b> " + pluralRu(r.depth, "вино", "вина", "вин"));
    const total = btgTotal(r.btg);
    if (total > 0) parts.push("<b>" + total + "</b> по бокалам");
    return parts.join(" · ");
  }

  function buildEntry(r, index) {
    const brief = buildBriefLine(r);
    const segLeader = isLeader(r.segment);
    const btgTotalN = btgTotal(r.btg);

    const sommelierRow = r.sommelier && String(r.sommelier).trim()
      ? '<div class="fg-prop"><dt class="fg-prop__key">Сомелье</dt><dd class="fg-prop__val">' + escapeHtml(r.sommelier) + '</dd></div>'
      : '';

    const autochVal = (function () {
      if (!r.autochthons) return '<dd class="fg-prop__val">—</dd>';
      const parts = String(r.autochthons).split(":").map(function (s) { return s.trim(); });
      if (parts.length === 2) {
        const sortN = Number(parts[0]);
        const bottN = Number(parts[1]);
        const sortWord = !isNaN(sortN) ? pluralRu(sortN, "сорт", "сорта", "сортов") : "сорта";
        const bottWord = !isNaN(bottN) ? pluralRu(bottN, "вино", "вина", "вин") : "вина";
        return '<dd class="fg-prop__val">' + escapeHtml(parts[0]) + ' <small>' + sortWord + '</small> · ' + escapeHtml(parts[1]) + ' <small>' + bottWord + '</small></dd>';
      }
      return '<dd class="fg-prop__val">' + escapeHtml(r.autochthons) + '</dd>';
    })();

    function renderBars(source) {
      const max = BTG_COLORS.reduce(function (m, c) {
        const v = Number(source && source[c.key]) || 0;
        return v > m ? v : m;
      }, 0);
      return '<div class="fg-bars">' + BTG_COLORS.map(function (c) {
        const n = Number(source && source[c.key]) || 0;
        const cls = n === 0 ? ' is-zero' : '';
        const pct = max > 0 ? Math.max(2, (n / max) * 100) : 0;
        return '<div class="fg-bar' + cls + '">' +
          '<span class="fg-bar__label">' + escapeHtml(c.label) + '</span>' +
          '<span class="fg-bar__track"><span class="fg-bar__fill fg-bar__fill--' + c.key + '" style="width:' + pct + '%"></span></span>' +
          '<span class="fg-bar__count">' + n + '</span>' +
        '</div>';
      }).join('') + '</div>';
    }

    const cardBreakdownTotal = r.card_breakdown
      ? BTG_COLORS.reduce(function (a, c) { return a + (Number(r.card_breakdown[c.key]) || 0); }, 0)
      : 0;
    const cardBarsHtml = cardBreakdownTotal > 0 ? renderBars(r.card_breakdown) : '';

    const btgBarsHtml = btgTotalN > 0
      ? renderBars(r.btg)
      : '<p class="fg-btg-empty">Карта рассчитана на бутылочный заказ</p>';

    const descHtml = r.description && String(r.description).trim()
      ? '<div class="fg-detail-desc"><p>' + escapeHtml(r.description) + '</p></div>'
      : '';

    const hasGlass = r.median_glass_rub !== null && r.median_glass_rub !== undefined && r.median_glass_rub !== '';
    const hasBottle = r.median_bottle_rub !== null && r.median_bottle_rub !== undefined && r.median_bottle_rub !== '';
    const priceHtml = (hasGlass || hasBottle)
      ? '<div class="fg-detail-prices">' +
          '<div class="fg-detail-prices__label">Ориентировочные цены</div>' +
          '<div class="fg-detail-prices__row">' +
            (hasGlass
              ? '<div class="fg-price"><span class="fg-price__key">Бокал</span><span class="fg-price__val">' + escapeHtml(fmtRub(r.median_glass_rub)) + '</span></div>'
              : '') +
            (hasBottle
              ? '<div class="fg-price"><span class="fg-price__key">Бутылка</span><span class="fg-price__val">' + escapeHtml(fmtRub(r.median_bottle_rub)) + '</span></div>'
              : '') +
          '</div>' +
        '</div>'
      : '';

    const addr = r.address && String(r.address).trim();
    const web = r.website && String(r.website).trim();
    let contactsHtml = '';
    if (addr || web) {
      const parts = [];
      if (addr) {
        const fullAddr = /москв/i.test(addr) ? addr : 'Москва, ' + addr;
        parts.push('<span class="fg-contact__val">' + escapeHtml(fullAddr) + '</span>');
      }
      if (web) {
        const url = String(web);
        const safeUrl = /^https?:\/\//i.test(url) ? url : 'https://' + url;
        const display = url.replace(/^https?:\/\//i, '').replace(/\/$/, '');
        parts.push('<a class="fg-contact__val" href="' + escapeHtml(safeUrl) + '" target="_blank" rel="noopener noreferrer">' + escapeHtml(display) + '</a>');
      }
      contactsHtml = '<div class="fg-detail-contacts">' + parts.join('<span class="fg-contact__sep" aria-hidden="true">·</span>') + '</div>';
    }

    const detailHtml =
      '<div class="fg-entry__detail" hidden>' +
        descHtml +
        '<div class="fg-detail-block">' +
          '<h4 class="fg-detail-block__title">Разделы карты' + (r.depth ? ' · ' + escapeHtml(fmtNum(r.depth)) + ' ' + pluralRu(r.depth, "вино", "вина", "вин") : '') + '</h4>' +
          cardBarsHtml +
        '</div>' +
        '<div class="fg-detail-block">' +
          '<h4 class="fg-detail-block__title">Бокальная программа' + (btgTotalN > 0 ? ' · ' + btgTotalN + ' ' + pluralRu(btgTotalN, "позиция", "позиции", "позиций") : '') + '</h4>' +
          btgBarsHtml +
        '</div>' +
        '<div class="fg-detail-block fg-detail-block--full">' +
          '<h4 class="fg-detail-block__title">О карте</h4>' +
          '<dl class="fg-props">' +
            sommelierRow +
            '<div class="fg-prop"><dt class="fg-prop__key">Всего вин</dt><dd class="fg-prop__val">' + escapeHtml(fmtNum(r.depth)) + '</dd></div>' +
            '<div class="fg-prop"><dt class="fg-prop__key">Сорта винограда</dt><dd class="fg-prop__val">' + escapeHtml(fmtNum(r.mono_grapes)) + '</dd></div>' +
            '<div class="fg-prop"><dt class="fg-prop__key">Бленды</dt><dd class="fg-prop__val">' + escapeHtml(fmtNum(r.blends)) + '</dd></div>' +
            '<div class="fg-prop"><dt class="fg-prop__key">Винодельни</dt><dd class="fg-prop__val">' + escapeHtml(fmtNum(r.producers)) + '</dd></div>' +
            '<div class="fg-prop"><dt class="fg-prop__key">ЗГУ</dt><dd class="fg-prop__val">' + escapeHtml(fmtNum(r.regions)) + '</dd></div>' +
            '<div class="fg-prop"><dt class="fg-prop__key">Российские автохтоны</dt>' + autochVal + '</div>' +
            (r.sparkling_subtypes ? '<div class="fg-prop"><dt class="fg-prop__key">Стили игристых</dt><dd class="fg-prop__val">' + escapeHtml(r.sparkling_subtypes) + '</dd></div>' : '') +
          '</dl>' +
        '</div>' +
        priceHtml +
        contactsHtml +
      '</div>';

    const nomHtml = r.nomination && String(r.nomination).trim()
      ? '<span class="fg-entry__segment is-leader">' + escapeHtml(r.nomination) + '</span>'
      : '';

    return (
      '<article class="fg-entry" data-rank="' + escapeHtml(String(r.rank)) + '">' +
        '<button class="fg-entry__head" aria-expanded="false" type="button">' +
          '<span class="fg-entry__rank">' + escapeHtml(String(r.rank)) + '</span>' +
          '<span class="fg-entry__name-block">' +
            '<span class="fg-entry__name">' + escapeHtml(r.name || '') + '</span>' +
            (brief ? '<span class="fg-entry__brief">' + brief + '</span>' : '') +
          '</span>' +
          nomHtml +
          '<span class="fg-entry__chevron" aria-hidden="true">⌄</span>' +
        '</button>' +
        detailHtml +
      '</article>'
    );
  }

  function render() {
    if (!DATA || !Array.isArray(DATA.restaurants)) {
      entriesEl.innerHTML = '';
      return;
    }
    const sorted = DATA.restaurants.slice().sort(function (a, b) {
      return (a.rank || 0) - (b.rank || 0);
    });
    entriesEl.innerHTML = sorted.map(buildEntry).join("");

    entriesEl.querySelectorAll(".fg-entry").forEach(function (entry) {
      const head = entry.querySelector(".fg-entry__head");
      const detail = entry.querySelector(".fg-entry__detail");
      head.addEventListener("click", function () {
        const expanded = head.getAttribute("aria-expanded") === "true";
        head.setAttribute("aria-expanded", expanded ? "false" : "true");
        if (expanded) {
          detail.setAttribute("hidden", "");
          entry.classList.remove("is-open");
        } else {
          detail.removeAttribute("hidden");
          entry.classList.add("is-open");
        }
        sendHeightToParent();
      });
    });

    sendHeightToParent();
  }

  /* ============ iframe-friendly (Tilda T123) ============ */
  function sendHeightToParent() {
    if (window.parent === window) return;
    try {
      const h = Math.max(
        document.documentElement.scrollHeight,
        document.body ? document.body.scrollHeight : 0
      );
      window.parent.postMessage({ type: "fg-cards-height", height: h }, "*");
    } catch (e) {}
  }

  if (typeof ResizeObserver !== "undefined") {
    try {
      const ro = new ResizeObserver(function () { sendHeightToParent(); });
      ro.observe(root);
    } catch (e) {}
  }
  window.addEventListener("load", sendHeightToParent);
  window.addEventListener("resize", sendHeightToParent);

  render();
})();
</script>
